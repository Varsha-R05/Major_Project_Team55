services:
  frontend:
    image: varshar005/project-frontend:latest
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    image: varshar005/project-backend:latest
    env_file:
      - ./backend/.env
    environment:
      PORT: "5000"
      CLIENT_URL: "${CLIENT_URL:-http://localhost:3000}"
      AI_API_URL: "http://ai:8000"
    ports:
      - "5000:5000"
    depends_on:
      ai:
        condition: service_healthy
    restart: unless-stopped

  ai:
    image: varshar005/ai-module:latest
    env_file:
      - ./ai_module/.env
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped